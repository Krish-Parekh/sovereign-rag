[project]
name = "sovereign-rag"
version = "0.2.0"
description = "Customer-support RAG on Amazon Bedrock in AWS Sydney"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools>=3.35.0",
    "boto3>=1.43.108",
    "openai[bedrock]>=3.24.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-ulid>=4.0.1",
    "types-boto3-lite[bedrock-agent,bedrock-agent-runtime,bedrock-runtime,dynamodb,s3]>=1.43.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
scripts = [
    "httpx>=0.28.1",
]

[tool.uv]
default-groups = ["dev", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/ask"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "ASYNC"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
